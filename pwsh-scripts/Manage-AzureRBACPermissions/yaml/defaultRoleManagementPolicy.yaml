# Role Management Policy Configuration
# This YAML file defines the default role assignment settings used on a PIM-enabled role.
# it is used as a template to create the PIM settings referenced in roleAssignments.yaml, using modifications from pimSettings.yaml.
# https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-resource-roles-configure-role-settings

- enabledRules: []
  id: Enablement_Admin_Eligibility
  ruleType: RoleManagementPolicyEnablementRule
  target:
    caller: Admin
    operations:
    - All
    level: Eligibility
    targetObjects: []
    inheritableSettings: []
    enforcedSettings: []
- isExpirationRequired: false
  maximumDuration: P365D
  id: Expiration_Admin_Eligibility
  ruleType: RoleManagementPolicyExpirationRule
  target:
    caller: Admin
    operations:
    - All
    level: Eligibility
    targetObjects: []
    inheritableSettings: []
    enforcedSettings: []
- notificationType: Email
  recipientType: Admin
  isDefaultRecipientsEnabled: true
  notificationLevel: All
  notificationRecipients: []
  id: Notification_Admin_Admin_Eligibility
  ruleType: RoleManagementPolicyNotificationRule
  target:
    caller: Admin
    operations:
    - All
    level: Eligibility
    targetObjects: []
    inheritableSettings: []
    enforcedSettings: []
- notificationType: Email
  recipientType: Requestor
  isDefaultRecipientsEnabled: true
  notificationLevel: All
  notificationRecipients: []
  id: Notification_Requestor_Admin_Eligibility
  ruleType: RoleManagementPolicyNotificationRule
  target:
    caller: Admin
    operations:
    - All
    level: Eligibility
    targetObjects: []
    inheritableSettings: []
    enforcedSettings: []
- notificationType: Email
  recipientType: Approver
  isDefaultRecipientsEnabled: true
  notificationLevel: All
  notificationRecipients: []
  id: Notification_Approver_Admin_Eligibility
  ruleType: RoleManagementPolicyNotificationRule
  target:
    caller: Admin
    operations:
    - All
    level: Eligibility
    targetObjects: []
    inheritableSettings: []
    enforcedSettings: []
- enabledRules:
  - MultiFactorAuthentication
