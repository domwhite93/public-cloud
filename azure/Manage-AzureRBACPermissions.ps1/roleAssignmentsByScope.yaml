# Role Assignments Configuration
# This YAML file defines the role assignments for various principals within the Azure Landing Zone (ALZ) setup.
# Valid Scopes can be:
# Management Group  - /providers/Microsoft.Management/managementGroups/{mg-name}
# Subscription      - /subscriptions/{subscriptionId}
# Resource Group    - /subscriptions/{subscriptionId}/resourceGroups/{rg-name}
# Resource          - /subscriptions/{subscriptionId}/resourceGroups/{rg-name}/providers/{resource-provider}/{resource-type}/{resource-name}

# Group / Department 1
- scope: providers/Microsoft.Management/managementGroups/alz
  assignments:
  - role: 'Owner'
    principalId: 3b956f46-0fa0-4cd5-bca4-01948a5aaeb6 # object Id of group or user
    pimSettingId: default-approval # since this is a highly privileged role, we require approval for activation
  - role: '[alz] Subscription Owner'
    principalId: 3b956f46-0fa0-4cd5-bca4-01948a5aaeb6 # Group 1
    pimSettingId: default # no approval required
  - role: '[alz] Application Owner (DevOps/AppOps)'
    principalId: 3b956f46-0fa0-4cd5-bca4-01948a5aaeb6 # Group 1
    pimSettingId: default
  - role: '[alz] Security Operations (SecOps)'
    principalId: 3b956f46-0fa0-4cd5-bca4-01948a5aaeb6 # Group 1
    pimSettingId: default

- scope: subscriptions/69484c33-471f-47b1-beec-d7a44b9f55ef
  assignments:
  - role: '[alz] Network Management (NetOps)'
    principalId: 3b956f46-0fa0-4cd5-bca4-01948a5aaeb6 # Group 1
    pimSettingId: default

